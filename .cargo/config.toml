# musl (Alpine and friends): Rust links musl targets statically by default, but
# the desktop app links GTK and libadwaita, which are shared libraries; a static
# binary can't. Link musl dynamically, as Alpine's own Rust packages do.
[target.'cfg(target_env = "musl")']
rustflags = ["-C", "target-feature=-crt-static"]
