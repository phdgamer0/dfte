# Test vectors, benchmark inputs and fuzz seeds are meant to be fixed bytes, so
# rules like "hard-coded cryptographic value" only produce noise there.
# (#[cfg(test)] modules inside src/ can't be excluded by path; their alerts are
# dismissed as "used in tests".)
paths-ignore:
  - "**/benches/**"
  - "**/tests/**"
  - "tests/**"
  - "fuzz/**"
