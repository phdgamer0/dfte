name: Security audit

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths: ["**/Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
