name: Security audit

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths: ["**/Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

# Every `run:` step fails on any error, unset variable, or failure inside a
# pipeline (e.g. `cargo ... | tee`), so no error is swallowed.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
