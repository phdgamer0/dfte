name: Benchmarks

# see manual §30: microbenchmarks on every PR, compared against the latest
# main baseline. Shared runners are noisy, so this reports and never fails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every `run:` step fails on any error, unset variable, or failure inside a
# pipeline (e.g. `cargo ... | tee`), so no error is swallowed.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  criterion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      # platform/linux (dfte-gtk) links GTK 4 + libadwaita (Ubuntu 24.04: 4.14 / 1.5).
      - name: GTK dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev
      # PRs compare against main. Pushes to main restore the previous main
      # baseline too, so each merge is compared with the one before it (and
      # criterion doesn't log "Failed to access .../main/sample.json").
      - name: Restore main baseline
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-main-${{ github.sha }}
          restore-keys: criterion-main-
      - name: Run benches
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -d target/criterion ]; then
            # Lenient: benches added by this PR have no main baseline yet;
            # strict --baseline panics on them.
            ARGS="--baseline-lenient main"
          else
            ARGS="--save-baseline main"
          fi
          cargo bench --workspace -- --warm-up-time 1 --measurement-time 3 --noplot $ARGS 2>&1 | tee bench.txt
      - name: Save main baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-main-${{ github.sha }}
      - name: Summary
        if: always()
        run: |
          {
            echo "### Benchmark results"
            echo '```'
            grep -E '^[A-Za-z0-9_/.-]+( |$)|time:|thrpt:|change:|Performance has|No change' bench.txt | grep -v '^Benchmarking' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-${{ github.sha }}
          path: |
            bench.txt
            target/criterion
