name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly run keeps macOS covered without spending macOS minutes on every PR.
  schedule:
    - cron: "0 2 * * *"

# Every `run:` step fails on any error, unset variable, or failure inside a
# pipeline (e.g. `cargo ... | tee`), so no error is swallowed.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # platform/linux (dfte-gtk) links GTK 4 + libadwaita (Ubuntu 24.04: 4.14 / 1.5).
      - name: GTK dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all --check
      - name: Every source file carries the copyright and license header
        run: |
          missing=$(git ls-files | grep -E '\.(rs|kt|kts|css|py)$|^tools/dist$|proguard-rules\.pro$|^\.github/workflows/.*\.yml$' \
            | while read -r f; do head -n 4 "$f" | grep -q 'SPDX-License-Identifier: PolyForm-Shield-1.0.0' || echo "$f"; done)
          if [ -n "$missing" ]; then
            echo "::error::files without the copyright/SPDX header:"; echo "$missing"; exit 1
          fi
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Plaintext bench mode stays out of app crates (manual §13, §30 #2)
        run: |
          # Feature unification enables bench-insecure-plaintext in workspace
          # builds via crates/bench; app crates built on their own must not get it.
          for c in dfte-core platform-ffi dfte-cli; do
            tree=$(cargo tree -q -p "$c" -e features)
            if grep -q 'bench-insecure-plaintext' <<<"$tree"; then
              echo "::error::$c pulls in bench-insecure-plaintext"
              exit 1
            fi
          done
          # Positive control: the guard must still detect the feature where it is enabled.
          tree=$(cargo tree -q -p bench -e features)
          grep -q 'bench-insecure-plaintext' <<<"$tree" || { echo "::error::guard self-check failed: feature not found in bench"; exit 1; }
      # Linux wpa_supplicant/zbus backend is feature-gated (manual §5 Linux); keep it compiling.
      - run: cargo clippy -p discovery --all-targets --features linux-wpa -- -D warnings
      - run: cargo test -p discovery --features linux-wpa

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # platform/linux (dfte-gtk) links GTK 4 + libadwaita (Ubuntu 24.04: 4.14 / 1.5).
      - name: GTK dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  # macOS runs on pushes to main, nightly and on demand, not on PRs: GitHub's
  # macOS arm64 pool is capacity-constrained (jobs were cancelled unacquired
  # after 15 min) and macOS minutes cost 10x on this private repo. A macOS
  # regression still surfaces within a day.
  test-macos:
    name: test (macos-latest)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  bindings:
    name: uniffi bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS (for the swiftc parse) follows test-macos: not on PRs.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # Kotlin + Swift sources from the compiled library (library mode) into
      # target/bindings, which is git-ignored. Generation must succeed on every
      # runner; where swiftc exists (macOS) the Swift output is also parsed.
      - name: Generate Kotlin and Swift bindings
        run: |
          cargo build -p platform-ffi
          case "$RUNNER_OS" in
            macOS) lib=target/debug/libplatform_ffi.dylib ;;
            *) lib=target/debug/libplatform_ffi.so ;;
          esac
          rm -rf target/bindings
          for lang in kotlin swift; do
            cargo run -p platform-ffi --features bindgen --bin uniffi-bindgen -- generate --library "$lib" --language "$lang" --out-dir "target/bindings/$lang" --no-format
          done
          kt=target/bindings/kotlin/uniffi/platform_ffi/platform_ffi.kt
          swift=target/bindings/swift/platform_ffi.swift
          for f in "$kt" "$swift"; do
            for sym in TransferManager TransferObserver PlatformDiscovery; do
              grep -q "$sym" "$f" || { echo "::error::$sym missing from $f"; exit 1; }
            done
            echo "$f: $(wc -l <"$f") lines"
          done
          if command -v swiftc >/dev/null; then
            swiftc -parse "$swift"
          fi

  deny:
    name: licenses + advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
