name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every `run:` step fails on any error, unset variable, or failure inside a
# pipeline (e.g. `cargo ... | tee`), so no error is swallowed.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Plaintext bench mode stays out of app crates (manual §13, §30 #2)
        run: |
          # Feature unification enables bench-insecure-plaintext in workspace
          # builds via crates/bench; app crates built on their own must not get it.
          for c in dfte-core platform-ffi; do
            tree=$(cargo tree -q -p "$c" -e features)
            if grep -q 'bench-insecure-plaintext' <<<"$tree"; then
              echo "::error::$c pulls in bench-insecure-plaintext"
              exit 1
            fi
          done
          # Positive control: the guard must still detect the feature where it is enabled.
          tree=$(cargo tree -q -p bench -e features)
          grep -q 'bench-insecure-plaintext' <<<"$tree" || { echo "::error::guard self-check failed: feature not found in bench"; exit 1; }
      # Linux wpa_supplicant/zbus backend is feature-gated (manual §5 Linux); keep it compiling.
      - run: cargo clippy -p discovery --all-targets --features linux-wpa -- -D warnings
      - run: cargo test -p discovery --features linux-wpa

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  deny:
    name: licenses + advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
