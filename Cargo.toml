[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/core",
    "crates/protocol",
    "crates/transport",
    "crates/crypto",
    "crates/discovery",
    "crates/storage",
    "crates/platform-ffi",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phdgamer0/dfte"

# see manual §50: unsafe is denied workspace-wide, allowed only per-module with justification
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
crypto = { path = "crates/crypto" }
storage = { path = "crates/storage" }
transport = { path = "crates/transport" }
discovery = { path = "crates/discovery" }
dfte-core = { path = "crates/core" }

serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
proptest = "1"
blake3 = "1.8"
tokio = { version = "1", default-features = false }
crossbeam-queue = "0.3"
serde_json = "1"
fs4 = "1.1"
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
snow = { version = "0.10", features = ["risky-raw-split"] }
ring = "0.17"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
criterion = "0.8"
serde_bytes = "0.11"
base64 = "0.22"
socket2 = { version = "0.6", features = ["all"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
futures-util = { version = "0.3", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
