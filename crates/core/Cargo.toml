[package]
name = "dfte-core"
description = "Transfer Manager and public API surface (manual §22)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Criterion flags reach every bench target; the libtest harness rejects them.
[lib]
bench = false

[lints]
workspace = true

[features]
default = []
# Benchmark-only (manual §30 #2): lets both peers agree to send data-stream
# bodies without AEAD. Never enabled by default; only the bench crate turns it on.
bench-insecure-plaintext = []

[dependencies]
protocol.workspace = true
crypto.workspace = true
storage.workspace = true
transport.workspace = true
discovery.workspace = true
# rt-multi-thread: the TransferManager owns the process's runtime (manual §27).
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
