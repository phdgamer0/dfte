[package]
name = "storage"
description = "File I/O, chunking, pre-allocation and resume state (manual §14/§17-§20)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Criterion flags reach every bench target; the libtest harness rejects them.
[lib]
bench = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
tracing.workspace = true
crossbeam-queue.workspace = true
tokio = { workspace = true, features = ["sync"] }
fs4.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

[[bench]]
name = "io"
harness = false
