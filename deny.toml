# see manual §45/§46: license allow-list + RustSec advisories on every dependency change
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml is unmaintained (no vulnerability). It reaches us only through
    # uniffi_bindgen -> askama, i.e. the build-time `uniffi-bindgen` binary behind
    # platform-ffi's `bindgen` feature; it is never linked into an app and only
    # parses uniffi's own templates/config. Drop this once uniffi moves off it.
    { id = "RUSTSEC-2026-0374", reason = "dev-time binding generator only (uniffi_bindgen -> askama); not shipped" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
